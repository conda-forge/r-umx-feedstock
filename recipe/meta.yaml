{% set version = "4.65.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-umx
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/umx_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/umx/umx_{{ version }}.tar.gz
  sha256: 5e1b72cc032c3af3a28087bf8b342f5ae8b79869b7879c84d1a05868a1041f67

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-diagrammer
    - r-mass
    - r-matrix
    - r-mumin
    - r-openmx >=2.20.0
    - r-r2html
    - r-rcurl
    - r-cowplot
    - r-gert
    - r-ggplot2
    - r-kableextra
    - r-knitr
    - r-lavaan
    - r-mvtnorm
    - r-nlme
    - r-openxlsx
    - r-paran
    - r-polycor
    - r-quantmod
    - r-scales
    - r-xtable
    - r-zoo
  run:
    - r-base
    - r-diagrammer
    - r-mass
    - r-matrix
    - r-mumin
    - r-openmx >=2.20.0
    - r-r2html
    - r-rcurl
    - r-cowplot
    - r-gert
    - r-ggplot2
    - r-kableextra
    - r-knitr
    - r-lavaan
    - r-mvtnorm
    - r-nlme
    - r-openxlsx
    - r-paran
    - r-polycor
    - r-quantmod
    - r-scales
    - r-xtable
    - r-zoo

test:
  commands:
    - $R -e "library('umx')"           # [not win]
    - "\"%R%\" -e \"library('umx')\""  # [win]

about:
  home: https://github.com/tbates/umx
  license: GPL-3.0-only
  summary: 'Quickly create, run, and report structural equation models, and twin models. See
    ''?umx'' for help, and umx_open_CRAN_page("umx") for NEWS. Timothy C. Bates, Michael
    C. Neale, Hermine H. Maes, (2019). umx: A library for Structural Equation and Twin
    Modelling in R. Twin Research and Human Genetics, 22, 27-41. <doi:10.1017/thg.2019.2>.'
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
    - khusmann
